# Production configuration — broker URL injected via environment variables.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mqtt-telemetry
spec:
  type: bindings.mqtt
  version: v1
  metadata:
  - name: url
    value: "tcp://mqtt-broker:1883"
  - name: topic
    value: "weather/telemetry"
  - name: consumerID
    value: "telemetry-processor-consumer"
scopes:
  - Telemetry

<main class="mx-auto flex min-h-screen max-w-7xl flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8">
  <section class="glass-panel weather-glow overflow-hidden px-6 py-7 sm:px-8 lg:px-10">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <div class="max-w-2xl space-y-3">
        <p class="text-sm font-semibold uppercase tracking-[0.32em] text-sky-200">Live weather station</p>
        <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">Current conditions</h1>
        <p class="text-sm leading-6 font-medium text-slate-200 sm:text-base">
          A live snapshot of the latest weather reading from your connected devices, styled with a calm dark-glass interface.
        </p>
      </div>
    </div>

    @if (latestReading()) {
      <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <app-reading-card
          label="Temperature"
          [value]="latestReading()?.temperatureFahrenheit"
          unit="°F"
          icon="🌡️"
          kind="temperature"
        ></app-reading-card>
        <app-reading-card
          label="Humidity"
          [value]="latestReading()?.humidity"
          unit="%"
          icon="💧"
          kind="humidity"
        ></app-reading-card>
        <app-reading-card
          label="Pressure"
          [value]="latestReading()?.pressure"
          unit="hPa"
          icon="🧭"
          kind="pressure"
        ></app-reading-card>
        <app-reading-card
          label="PM1.0 (Atmospheric)"
          [value]="latestReading()?.pm1_0"
          unit="ug/m3"
          icon="🌫️"
          kind="pm1_0"
        ></app-reading-card>
        <app-reading-card
          label="PM2.5 (Atmospheric)"
          [value]="latestReading()?.pm2_5"
          unit="ug/m3"
          icon="🌫️"
          kind="pm2_5"
        ></app-reading-card>
        <app-reading-card
          label="PM10 (Atmospheric)"
          [value]="latestReading()?.pm10_0"
          unit="ug/m3"
          icon="🌫️"
          kind="pm10_0"
        ></app-reading-card>
      </div>
    } @else {
      <div class="mt-8 rounded-2xl border border-dashed border-white/15 bg-slate-950/70 p-6 text-sm font-medium text-slate-300">
        Waiting for the first reading to arrive.
      </div>
    }
  </section>

  <app-dashboard-controls
    [isRefreshing]="isRefreshing()"
    [selectedDevice]="selectedDevice()"
    [devices]="devices()"
    [latestReadingTimestamp]="latestReading()?.timestamp ?? null"
    (refresh)="refresh()"
    (deviceChange)="onDeviceChange($event)"
  ></app-dashboard-controls>

  <app-readings-table
    [readings]="readings()"
    [selectedDevice]="selectedDevice()"
    [pageNumberValue]="currentPage()"
    [totalCount]="totalRecords()"
    [loading]="isPageLoading()"
    (pageChange)="setPage($event)"
  ></app-readings-table>
</main>

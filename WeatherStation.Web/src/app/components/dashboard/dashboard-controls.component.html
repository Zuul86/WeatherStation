<section class="glass-panel flex flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between w-full">
    <button
      class="inline-flex items-center justify-center rounded-full border border-sky-400/40 bg-sky-500/15 px-4 py-2 text-sm font-semibold text-sky-100 transition duration-200 hover:bg-sky-500/25 disabled:cursor-not-allowed disabled:opacity-60"
      type="button"
      (click)="refresh.emit()"
      [disabled]="isRefreshing"
    >
      {{ isRefreshing ? 'Refreshing…' : 'Refresh now' }}
    </button>

    <label class="flex flex-col gap-2 text-sm text-slate-300">
      <span class="text-xs font-semibold uppercase tracking-[0.28em] text-slate-400">Device</span>
      <select
        class="rounded-full border border-white/15 bg-slate-950/80 px-3 py-2 text-sm font-medium text-slate-100 outline-none ring-0 transition focus:border-sky-400/50"
        [value]="selectedDevice ?? ''"
        (change)="onDeviceChange($event)"
      >
        <option value="">All devices</option>
        <ng-container *ngFor="let device of devices">
          <option [value]="device">{{ device }}</option>
        </ng-container>
      </select>
    </label>
  </div>

  <div class="flex flex-wrap items-center gap-3 text-sm text-slate-300">
    <span class="rounded-full border border-white/15 bg-white/10 px-3 py-1.5 font-medium text-slate-100">
      {{ latestReadingTimestamp ? (latestReadingTimestamp | date:'EEEE, MMM d, yyyy h:mm:ss a':'GMT-06:00') : 'Waiting for data' }}
    </span>
  </div>
</section>

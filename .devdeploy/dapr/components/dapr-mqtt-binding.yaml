# Local development configuration — used by Aspire AppHost.
# For production, see dapr/components/production/
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mqtt-telemetry
spec:
  type: bindings.mqtt
  version: v1
  ignoreErrors: true
  metadata:
  - name: url
    value: "tcp://localhost:1883"
  - name: topic
    value: "weather/telemetry"
  - name: consumerID
    value: "telemetry-processor-consumer"
scopes:
  - telemetry


---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "telemetryprocessor-deployment"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "telemetryprocessor"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Chart.Name }}"
        app.kubernetes.io/component: "telemetryprocessor"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "Telemetry"
        dapr.io/app-port: "{{ .Values.parameters.telemetryprocessor.port_http }}"
        dapr.io/app-protocol: "http"
    spec:
      containers:
        - image: "{{ .Values.parameters.telemetryprocessor.telemetryprocessor_image }}"
          name: "telemetryprocessor"
          envFrom:
            - configMapRef:
                name: "telemetryprocessor-config"
          ports:
            - name: "http"
              protocol: "TCP"
              containerPort: {{ .Values.parameters.telemetryprocessor.port_http | int }}
          imagePullPolicy: "IfNotPresent"
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Chart.Name }}"
      app.kubernetes.io/component: "telemetryprocessor"
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: "RollingUpdate"

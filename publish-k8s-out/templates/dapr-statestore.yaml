# Production configuration — credentials injected via environment variables.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: dapr-postgres-secrets
      key: connectionString
  - name: tableName
    value: "state"
  - name: actorStateStore
    value: "false"

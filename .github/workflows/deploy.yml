name: Deploy to Azure

on:
  push:
    branches: [master]
    paths:
      # Only run if actual app or deployment files change
      - 'WeatherStation.Api/**'
      - 'WeatherStation.AppHost/**'
      - 'WeatherStation.ServiceDefaults/**'
      - 'WeatherStation.TelemetryProcessor/**'
      - 'WeatherStation.Web/**'
      - 'deploy/**'
      - 'WeatherStation.slnx'
      - 'nuget.config'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore and build .NET workspace
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Install and build frontend workspace
        working-directory: WeatherStation.Web
        run: |
          npm ci
          npm run build --if-present

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: aspire deploy --environment Production --non-interactive
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Parameters__postgres_password: ${{ secrets.POSTGRES_PASSWORD }}

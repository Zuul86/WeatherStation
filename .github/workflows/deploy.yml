name: Deploy with Aspire

on:
  push:
    branches: [master]
    paths:
      - 'WeatherStation.Api/**'
      - 'WeatherStation.AppHost/**'
      - 'WeatherStation.ServiceDefaults/**'
      - 'WeatherStation.TelemetryProcessor/**'
      - 'WeatherStation.Web/**'
      - 'deploy/**'
      - 'WeatherStation.slnx'
      - 'nuget.config'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Install Dapr CLI
        uses: dapr/setup-dapr@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy with Aspire
        run: aspire deploy --apphost ./WeatherStation.AppHost/WeatherStation.AppHost.csproj --environment production --non-interactive
        env:
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
          Azure__Location: ${{ vars.AZURE_LOCATION || secrets.AZURE_LOCATION || 'eastus' }}
          Parameters__postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__iothub_connection_string: ${{ secrets.IOTHUB_CONNECTION_STRING }}

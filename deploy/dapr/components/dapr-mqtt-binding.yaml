# Production configuration — Azure IoT Hub
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mqtt-telemetry
spec:
  type: bindings.azure.iothub
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: iothub-secrets
      key: connectionString
  - name: consumerGroup
    value: "telemetry-processor-consumer"
scopes:
  - telemetry

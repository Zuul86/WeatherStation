services:
  # --- Infrastructure ---
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-weatherdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-weatherdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-broker:
    build:
      context: ./WeatherStation.AppHost
      dockerfile: Dockerfile
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Dapr Sidecars + Application Services ---
  telemetry-processor:
    build:
      context: .
      dockerfile: WeatherStation.TelemetryProcessor/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DaprStateStoreName: ${DAPR_STATE_STORE_NAME:-statestore}
      ConnectionStrings__statestore: "host=postgres;port=5432;database=${POSTGRES_DB:-weatherdb};username=${POSTGRES_USER:-postgres};password=${POSTGRES_PASSWORD:-changeme}"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    network_mode: "service:telemetry-processor-dapr"

  telemetry-processor-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      [
        "./daprd",
        "--app-id", "Telemetry",
        "--app-port", "8080",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--resources-path", "/components",
        "--placement-host-address", "",
        "--log-level", "info"
      ]
    volumes:
      - ./dapr/components/production:/components:ro
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "3500:3500"

  api:
    build:
      context: .
      dockerfile: WeatherStation.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DaprStateStoreName: ${DAPR_STATE_STORE_NAME:-statestore}
      AllowedCorsOrigins: ${ALLOWED_CORS_ORIGINS:-http://localhost:4200}
      ConnectionStrings__statestore: "host=postgres;port=5432;database=${POSTGRES_DB:-weatherdb};username=${POSTGRES_USER:-postgres};password=${POSTGRES_PASSWORD:-changeme}"
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:api-dapr"

  api-dapr:
    image: "daprio/daprd:1.14.4"
    command:
      [
        "./daprd",
        "--app-id", "Api",
        "--app-port", "8080",
        "--dapr-http-port", "3501",
        "--dapr-grpc-port", "50002",
        "--resources-path", "/components",
        "--placement-host-address", "",
        "--log-level", "info"
      ]
    volumes:
      - ./dapr/components/production:/components:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5081:8080"
      - "3501:3501"

  # --- Frontend ---
  web:
    build:
      context: ./WeatherStation.Web
      dockerfile: Dockerfile
    environment:
      API_URL: ${API_URL:-http://localhost:5081/graphql}
    ports:
      - "4200:80"
    depends_on:
      - api-dapr

volumes:
  postgres-data:
